[workspace]
description = "Mist lets you safely use advanced styling options on the terminal."
authors = ["Mikhail Tavarez <miktavarez@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/thatstoasty/mist"
repository = "https://github.com/thatstoasty/mist"
preview = ["pixi-build"]

[tasks]
tests = "sh -c 'find test -name \"test_*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
benchmarks = "mojo -D ASSERT=all -I . benchmarks/run.mojo --print-relative"
examples = "sh -c 'find examples -name \"*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
test_readme_examples = "python3 utils/test_readme_examples.py"

# Linting and Formatting
lint_docs = "mojo doc --Werror --diagnose-missing-doc-strings -o /dev/null ./mist"
mojo_format = "mojo format mist --line-length 120"
format = [{ task = "mojo_format" }]

# Build and publish
build = { cmd = "pixi build -o ." }
publish = { cmd = "find . -name 'mist-*.conda' | xargs pixi upload https://prefix.dev/api/v1/upload/mojo-community" }
build_and_publish = [{ task = "build" }, { task = "publish" }]

[package]
name = "mist"
version = "0.3.1"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[dependencies]
mojo = ">=1.0.0,<1.1.0"

[package.host-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"

[package.build-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"
